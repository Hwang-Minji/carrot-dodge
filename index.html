<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토끼의 당근 피하기</title>
<style>
  :root {
    --bg: #fff4e0;
    --ink: #3b2a1a;
    --accent: #ff8a1f;
    --accent-dark: #c85f00;
    --btn: #ffe0b8;
    --btn-press: #ffc785;
    --line: #e3a35f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; color: inherit; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* 점수·목숨 */
  .hud { padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .score { font-size: 34px; font-weight: 900; line-height: 1; white-space: nowrap; }
  .score .label { font-size: 18px; font-weight: 700; margin-right: 6px; }
  .score small { font-size: 18px; font-weight: 700; opacity: .55; }
  #musicBtn {
    flex: none;
    font-size: 15px;
    font-weight: 700;
    padding: 9px 14px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: #fff;
    cursor: pointer;
  }
  #musicBtn:disabled { opacity: .5; cursor: default; }
  #lives { flex: none; width: 160px; height: 30px; display: block; }
  .bar { flex: 1; min-width: 0; height: 14px; border-radius: 999px; background: #f1dcc0; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; }

  /* 게임 화면 */
  #stage {
    position: relative;
    flex: 1;
    min-height: 180px;
    margin: 0 16px;
    border-radius: 18px;
    overflow: hidden;
    border: 3px solid var(--line);
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }

  /* 좌우 버튼 */
  .controls { display: flex; gap: 12px; padding: 10px 16px 12px; }
  .ctrl {
    flex: 1;
    min-width: 0;
    height: 76px;
    border-radius: 20px;
    border: 3px solid var(--line);
    background: var(--btn);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    -webkit-touch-callout: none;
  }
  .ctrl.on { background: var(--btn-press); transform: translateY(2px); }
  .ctrl svg { width: 40px; height: 40px; fill: var(--ink); pointer-events: none; }

  /* 겹쳐 보이는 화면들 */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    text-align: center;
    background: var(--bg);
    overflow-y: auto;
  }
  .overlay.dim { background: rgba(59, 42, 26, .55); }
  .card {
    width: 100%;
    max-width: 340px;
    background: #fff;
    border-radius: 24px;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 0 rgba(0, 0, 0, .12);
  }
  #poster { display: block; max-width: 100%; max-height: 62vh; object-fit: contain; border-radius: 18px; }
  #posterFallback { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #posterArt { width: 180px; height: 180px; display: block; }
  .title { font-size: 34px; font-weight: 900; margin: 0; line-height: 1.2; }
  .help { font-size: 16px; line-height: 1.55; margin: 0; max-width: 320px; }
  .big-btn {
    font-size: 24px;
    font-weight: 900;
    padding: 16px 44px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 5px 0 var(--accent-dark);
    cursor: pointer;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }

  #endScreen { background: #000; padding: 0; }
  #ending { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .end-ui {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: calc(28px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  #endSkip {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    right: 16px;
    font-size: 15px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, .6);
    background: rgba(0, 0, 0, .4);
    color: #fff;
    cursor: pointer;
  }
  #clearFallback { position: absolute; inset: 0; background: var(--bg); padding: 16px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="row">
      <div class="score"><span class="label">점수</span><span id="score">0</span><small> / 300</small></div>
      <button id="musicBtn" type="button">음악 끄기</button>
    </div>
    <div class="row">
      <canvas id="lives" aria-label="목숨"></canvas>
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    </div>
  </header>

  <div id="stage"><canvas id="game"></canvas></div>

  <div class="controls">
    <button id="leftBtn" class="ctrl" type="button" aria-label="왼쪽으로">
      <svg viewBox="0 0 24 24"><polygon points="16,4 5,12 16,20"/></svg>
    </button>
    <button id="rightBtn" class="ctrl" type="button" aria-label="오른쪽으로">
      <svg viewBox="0 0 24 24"><polygon points="8,4 19,12 8,20"/></svg>
    </button>
  </div>
</div>

<!-- 시작 화면 -->
<div id="startScreen" class="overlay">
  <img id="poster" src="poster.png" alt="게임 포스터" hidden>
  <div id="posterFallback">
    <canvas id="posterArt" aria-hidden="true"></canvas>
    <h1 class="title">토끼의 당근 피하기</h1>
  </div>
  <p class="help">떨어지는 당근을 피해 300점을 모으세요!<br>← → 키, 아래 버튼, 화면 끌기로 움직여요.</p>
  <button id="startBtn" class="big-btn" type="button">시작</button>
</div>

<!-- 게임 오버 -->
<div id="overScreen" class="overlay dim" hidden>
  <div class="card">
    <h2 class="title">게임 오버</h2>
    <p class="help" id="overText">점수 0점</p>
    <button id="overRetry" class="big-btn" type="button">다시 하기</button>
  </div>
</div>

<!-- 클리어: 엔딩 영상 -->
<div id="endScreen" class="overlay" hidden>
  <video id="ending" src="ending.mp4" playsinline webkit-playsinline preload="auto"></video>
  <button id="endSkip" type="button">건너뛰기</button>
  <div class="end-ui"><button id="endRetry" class="big-btn" type="button" hidden>다시 하기</button></div>
  <div id="clearFallback" hidden>
    <div class="card">
      <h2 class="title">클리어!</h2>
      <p class="help">당근을 모두 피했어요. 300점 달성!</p>
      <button id="clearRetry" class="big-btn" type="button">다시 하기</button>
    </div>
  </div>
</div>

<audio id="music" src="music.mp3" loop preload="auto"></audio>

<script>
  const MAX_LIVES = 5;
  const GOAL = 300;
  const POINTS_PER_SEC = 20;
  const INVINCIBLE_SEC = 1.5;

  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const cv = $('game');
  const ctx = cv.getContext('2d');
  const livesCv = $('lives');
  const lctx = livesCv.getContext('2d');
  const scoreEl = $('score');
  const barEl = $('bar');
  const musicBtn = $('musicBtn');
  const music = $('music');
  const video = $('ending');
  const poster = $('poster');

  let W = 0, H = 0, dpr = 1;
  let state = 'start'; // start | play | over | clear
  let lives = MAX_LIVES;
  let elapsed = 0;
  let invTimer = 0;
  let spawnTimer = 0;
  let flash = 0;
  let shownScore = -1;
  let carrots = [];
  const rabbit = { x: 0 };
  const input = { keyL: false, keyR: false, btnL: false, btnR: false, drag: false, tx: 0 };

  let musicOn = true;
  let musicFailed = false;
  let videoFailed = false;

  // ---------- 미디어: 없거나 막혀도 게임은 계속 ----------
  function safePlay(el) {
    try {
      const p = el.play();
      return p && typeof p.then === 'function' ? p : Promise.resolve();
    } catch (e) {
      return Promise.reject(e);
    }
  }

  function showPoster() {
    poster.hidden = false;
    $('posterFallback').hidden = true;
  }
  poster.addEventListener('load', showPoster);
  poster.addEventListener('error', () => {
    poster.hidden = true;
    $('posterFallback').hidden = false;
  });
  if (poster.complete && poster.naturalWidth > 0) showPoster();

  function markMusicFailed() {
    musicFailed = true;
    musicBtn.disabled = true;
    musicBtn.textContent = '음악 없음';
  }
  music.addEventListener('error', markMusicFailed);
  if (music.error) markMusicFailed();

  function playMusic() {
    if (!musicOn || musicFailed) return;
    safePlay(music).catch(() => {});
  }

  musicBtn.addEventListener('click', () => {
    musicOn = !musicOn;
    musicBtn.textContent = musicOn ? '음악 끄기' : '음악 켜기';
    if (musicOn && (state === 'play' || state === 'over')) playMusic();
    else music.pause();
    musicBtn.blur();
  });

  video.addEventListener('error', () => {
    videoFailed = true;
    if (state === 'clear') showClearFallback();
  });
  if (video.error) videoFailed = true;
  video.addEventListener('ended', showEndRetry);
  $('endSkip').addEventListener('click', () => {
    video.pause();
    showEndRetry();
  });

  function showEndRetry() {
    if (state !== 'clear') return;
    $('endSkip').hidden = true;
    $('endRetry').hidden = false;
    $('endRetry').focus();
  }

  function showClearFallback() {
    try { video.pause(); } catch (e) {}
    video.hidden = true;
    $('endSkip').hidden = true;
    $('endRetry').hidden = true;
    $('clearFallback').hidden = false;
    $('clearRetry').focus();
  }

  function showEnding() {
    $('endScreen').hidden = false;
    $('endRetry').hidden = true;
    $('clearFallback').hidden = true;
    if (videoFailed || video.error) {
      showClearFallback();
      return;
    }
    music.pause();
    video.hidden = false;
    $('endSkip').hidden = false;
    try { video.currentTime = 0; } catch (e) {}
    video.muted = false;
    // 소리 재생이 막히면 음소거로 한 번 더, 그래도 안 되면 클리어 화면으로
    safePlay(video)
      .catch(() => { video.muted = true; return safePlay(video); })
      .catch(() => { if (state === 'clear') showClearFallback(); });
  }

  // ---------- 크기 ----------
  function dims() {
    const s = Math.max(28, Math.min(W * 0.14, H * 0.12, 62));
    return { s, groundY: H - Math.max(14, H * 0.05) };
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    const nw = Math.max(1, r.width);
    const nh = Math.max(1, r.height);
    if (W && H) {
      const sx = nw / W, sy = nh / H;
      rabbit.x *= sx;
      input.tx *= sx;
      for (const c of carrots) { c.x *= sx; c.y *= sy; c.L *= Math.min(sx, sy); }
    } else {
      rabbit.x = nw / 2;
    }
    W = nw;
    H = nh;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    livesCv.width = Math.round(160 * dpr);
    livesCv.height = Math.round(30 * dpr);
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawLives();
    draw();
  }

  // ---------- 그리기 ----------
  function ellipse(c, x, y, rx, ry, rot) {
    c.beginPath();
    c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  function drawRabbit(c, x, gy, s) {
    c.save();
    c.translate(x, gy);
    c.lineWidth = Math.max(2, s * 0.05);
    c.strokeStyle = '#5a4636';
    c.lineJoin = 'round';

    for (const side of [-1, 1]) {
      c.save();
      c.translate(side * s * 0.13, -s * 1.02);
      c.rotate(side * 0.15);
      ellipse(c, 0, 0, s * 0.09, s * 0.27);
      c.fillStyle = '#fff'; c.fill(); c.stroke();
      ellipse(c, 0, s * 0.03, s * 0.045, s * 0.18);
      c.fillStyle = '#ffb3c6'; c.fill();
      c.restore();
    }

    ellipse(c, 0, -s * 0.33, s * 0.4, s * 0.33);
    c.fillStyle = '#fff'; c.fill(); c.stroke();
    for (const side of [-1, 1]) {
      ellipse(c, side * s * 0.2, -s * 0.05, s * 0.14, s * 0.07);
      c.fillStyle = '#fff'; c.fill(); c.stroke();
    }

    c.beginPath();
    c.arc(0, -s * 0.74, s * 0.28, 0, Math.PI * 2);
    c.fillStyle = '#fff'; c.fill(); c.stroke();

    c.fillStyle = '#3b2a1a';
    for (const side of [-1, 1]) {
      c.beginPath(); c.arc(side * s * 0.1, -s * 0.78, s * 0.042, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = '#fff';
    for (const side of [-1, 1]) {
      c.beginPath(); c.arc(side * s * 0.1 + s * 0.015, -s * 0.795, s * 0.014, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = 'rgba(255,140,170,.55)';
    for (const side of [-1, 1]) {
      ellipse(c, side * s * 0.17, -s * 0.66, s * 0.05, s * 0.032); c.fill();
    }
    ellipse(c, 0, -s * 0.69, s * 0.035, s * 0.025);
    c.fillStyle = '#ff7f9f'; c.fill();
    c.beginPath();
    c.moveTo(0, -s * 0.665);
    c.quadraticCurveTo(-s * 0.03, -s * 0.61, -s * 0.06, -s * 0.63);
    c.moveTo(0, -s * 0.665);
    c.quadraticCurveTo(s * 0.03, -s * 0.61, s * 0.06, -s * 0.63);
    c.lineWidth = Math.max(1.5, s * 0.03);
    c.stroke();
    c.restore();
  }

  function drawCarrot(c, x, y, L, rot) {
    const w = L * 0.4;
    c.save();
    c.translate(x, y);
    c.rotate(rot || 0);
    c.fillStyle = '#4caf50';
    c.strokeStyle = '#2e7d32';
    c.lineWidth = Math.max(1.5, L * 0.03);
    for (const a of [-0.5, 0, 0.5]) {
      ellipse(c, Math.sin(a) * L * 0.12, -L * 0.42, L * 0.06, L * 0.15, a);
      c.fill(); c.stroke();
    }
    c.beginPath();
    c.moveTo(-w / 2, -L * 0.3);
    c.quadraticCurveTo(-w * 0.45, L * 0.1, 0, L * 0.5);
    c.quadraticCurveTo(w * 0.45, L * 0.1, w / 2, -L * 0.3);
    c.quadraticCurveTo(0, -L * 0.4, -w / 2, -L * 0.3);
    c.closePath();
    c.fillStyle = '#ff8a1f';
    c.strokeStyle = '#c85f00';
    c.lineWidth = Math.max(2, L * 0.04);
    c.fill(); c.stroke();
    c.beginPath();
    c.moveTo(-w * 0.32, -L * 0.12); c.lineTo(-w * 0.08, -L * 0.1);
    c.moveTo(w * 0.3, L * 0.02); c.lineTo(w * 0.06, L * 0.04);
    c.moveTo(-w * 0.2, L * 0.2); c.lineTo(-w * 0.02, L * 0.21);
    c.lineWidth = Math.max(1.5, L * 0.03);
    c.stroke();
    c.restore();
  }

  function drawHeart(c, x, y, r, filled) {
    c.beginPath();
    c.moveTo(x, y + r * 0.9);
    c.bezierCurveTo(x - r * 1.7, y - r * 0.1, x - r * 0.7, y - r * 1.5, x, y - r * 0.5);
    c.bezierCurveTo(x + r * 0.7, y - r * 1.5, x + r * 1.7, y - r * 0.1, x, y + r * 0.9);
    c.closePath();
    c.fillStyle = filled ? '#ff4d6d' : '#ead9c6';
    c.fill();
    c.lineWidth = 2;
    c.strokeStyle = filled ? '#c9184a' : '#d6bfa6';
    c.stroke();
  }

  function drawLives() {
    lctx.clearRect(0, 0, 160, 30);
    for (let i = 0; i < MAX_LIVES; i++) drawHeart(lctx, 16 + i * 32, 16, 12, i < lives);
  }

  function draw() {
    const { s, groundY } = dims();
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#bfe6ff');
    sky.addColorStop(1, '#eef9ff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const [fx, fy, fr] of [[0.2, 0.14, 0.07], [0.75, 0.24, 0.09]]) {
      const cx = fx * W, cy = fy * H, r = fr * W;
      ellipse(ctx, cx, cy, r * 1.6, r * 0.7); ctx.fill();
      ellipse(ctx, cx + r * 0.5, cy - r * 0.4, r * 0.8, r * 0.6); ctx.fill();
    }

    ctx.fillStyle = '#8bd36b';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#6dbb4f';
    ctx.fillRect(0, groundY, W, 4);

    for (const c of carrots) drawCarrot(ctx, c.x, c.y, c.L, c.rot);

    const blinkOff = invTimer > 0 && Math.floor(invTimer * 10) % 2 === 0;
    ctx.globalAlpha = blinkOff ? 0.25 : 1;
    drawRabbit(ctx, rabbit.x, groundY, s);
    ctx.globalAlpha = 1;

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,80,80,${flash * 1.2})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function updateHud() {
    const score = Math.min(GOAL, Math.floor(elapsed * POINTS_PER_SEC));
    if (score !== shownScore) {
      shownScore = score;
      scoreEl.textContent = score;
      barEl.style.width = (score / GOAL * 100) + '%';
    }
  }

  // ---------- 게임 진행 ----------
  function resetGame() {
    lives = MAX_LIVES;
    elapsed = 0;
    invTimer = 0;
    spawnTimer = 0.8;
    flash = 0;
    carrots = [];
    rabbit.x = W / 2;
    clearInput();
    shownScore = -1;
    updateHud();
    drawLives();
  }

  function spawnCarrot() {
    const { s } = dims();
    const L = s * 0.95;
    const margin = L * 0.3 + 4;
    // 시간이 지날수록 아주 조금씩 빨라짐 (화면 높이를 약 5초 → 3초에 내려옴)
    const speed = H * (0.2 + 0.008 * elapsed) * (0.9 + Math.random() * 0.2);
    carrots.push({
      x: margin + Math.random() * Math.max(0, W - margin * 2),
      y: -L * 0.6,
      L,
      rot: (Math.random() - 0.5) * 0.4,
      speed,
    });
  }

  function update(dt) {
    const { s, groundY } = dims();
    elapsed += dt;

    const speed = Math.max(240, W * 0.9);
    if (input.drag) {
      const d = input.tx - rabbit.x;
      const step = Math.max(speed * 2, 600) * dt;
      rabbit.x += Math.abs(d) <= step ? d : Math.sign(d) * step;
    } else {
      const dir = (input.keyL || input.btnL ? -1 : 0) + (input.keyR || input.btnR ? 1 : 0);
      rabbit.x += dir * speed * dt;
    }
    const half = s * 0.42;
    rabbit.x = Math.max(half, Math.min(W - half, rabbit.x));

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnCarrot();
      spawnTimer = Math.max(0.7, 1.0 - 0.02 * elapsed);
    }

    // 부딪힘 판정: 그림보다 작은 원 두 개
    const rx = rabbit.x, ry = groundY - s * 0.5, rr = s * 0.3;
    for (let i = carrots.length - 1; i >= 0; i--) {
      const c = carrots[i];
      c.y += c.speed * dt;
      if (c.y - c.L > H) { carrots.splice(i, 1); continue; }
      if (invTimer > 0) continue;
      const cr = c.L * 0.12;
      const dx = c.x - rx, dy = c.y - ry;
      if (dx * dx + dy * dy < (rr + cr) * (rr + cr)) {
        carrots.splice(i, 1);
        hit();
        if (state !== 'play') return;
      }
    }
    if (invTimer > 0) invTimer = Math.max(0, invTimer - dt);

    updateHud();
    if (elapsed * POINTS_PER_SEC >= GOAL) win();
  }

  function hit() {
    lives -= 1;
    invTimer = INVINCIBLE_SEC;
    flash = 0.3;
    drawLives();
    try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
    if (lives <= 0) lose();
  }

  function lose() {
    state = 'over';
    clearInput();
    updateHud();
    $('overText').textContent = `점수 ${shownScore}점 · 조금만 더 해 봐요!`;
    $('overScreen').hidden = false;
    $('overRetry').focus();
  }

  function win() {
    state = 'clear';
    clearInput();
    carrots = [];
    updateHud();
    showEnding();
  }

  function startGame() {
    for (const id of ['startScreen', 'overScreen', 'endScreen']) $(id).hidden = true;
    try { video.pause(); } catch (e) {}
    resetGame();
    state = 'play';
    playMusic();
  }

  $('startBtn').addEventListener('click', startGame);
  $('overRetry').addEventListener('click', startGame);
  $('endRetry').addEventListener('click', startGame);
  $('clearRetry').addEventListener('click', startGame);

  // ---------- 조작 ----------
  function clearInput() {
    input.keyL = input.keyR = input.btnL = input.btnR = input.drag = false;
    $('leftBtn').classList.remove('on');
    $('rightBtn').classList.remove('on');
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { input.keyL = true; input.drag = false; e.preventDefault(); }
    else if (e.key === 'ArrowRight') { input.keyR = true; input.drag = false; e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') input.keyL = false;
    else if (e.key === 'ArrowRight') input.keyR = false;
  });
  window.addEventListener('blur', clearInput);

  function holdButton(btn, key) {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      input[key] = true;
      input.drag = false;
      btn.classList.add('on');
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    });
    const release = () => { input[key] = false; btn.classList.remove('on'); };
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(t, release);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  holdButton($('leftBtn'), 'btnL');
  holdButton($('rightBtn'), 'btnR');

  function localX(e) {
    return e.clientX - cv.getBoundingClientRect().left;
  }
  cv.addEventListener('pointerdown', (e) => {
    if (state !== 'play') return;
    e.preventDefault();
    input.drag = true;
    input.tx = localX(e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', (e) => {
    if (input.drag) input.tx = localX(e);
  });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    cv.addEventListener(t, () => { input.drag = false; });
  }

  // ---------- 시작 ----------
  (function drawPosterArt() {
    const pc = $('posterArt');
    const pd = Math.min(window.devicePixelRatio || 1, 3);
    pc.width = 180 * pd;
    pc.height = 180 * pd;
    const c = pc.getContext('2d');
    c.setTransform(pd, 0, 0, pd, 0, 0);
    drawCarrot(c, 40, 50, 50, -0.3);
    drawCarrot(c, 145, 38, 44, 0.25);
    drawRabbit(c, 92, 172, 105);
  })();

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    if (state === 'play') update(dt);
    if (flash > 0) flash = Math.max(0, flash - dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
